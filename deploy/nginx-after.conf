# nginx configuration TEMPLATE AFTER the cutover
# This is a starting point for the production team, not a drop-in guarantee.
# Replace the Go backend host/port, certificate paths and any site-specific
# security or caching policy before applying it. Always run `nginx -t` first.

upstream nextendo_app {
  # Next.js standalone server started by `node .next/standalone/server.js`.
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream nextendo_account {
  # Go account service. Replace this placeholder with the real host/port.
  server 127.0.0.1:8080;
  keepalive 32;
}

# Cache: separate bucket for hashed asset bundles (1y) vs HTML (10s).
proxy_cache_path /var/cache/nginx/nextendo levels=1:2 keys_zone=nextendo:10m max_size=1g inactive=24h;

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name nextendo.network;

  ssl_certificate     /etc/letsencrypt/live/nextendo.network/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nextendo.network/privkey.pem;

  # Security headers — applied globally to every response.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # robots.txt and sitemap.xml are served by Next.js as static files
  # from the /app/public/ directory. Cache at the edge.
  location = /robots.txt { proxy_pass http://nextendo_app; proxy_cache nextendo; expires 1h; add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { proxy_pass http://nextendo_app; proxy_cache nextendo; expires 1h; add_header Cache-Control "public, max-age=3600"; }

  # Favicon and other public/static assets — cache for 1 day.
  location ~* \.(svg|png|jpg|jpeg|ico|webp|woff2?)$ {
    proxy_pass http://nextendo_app;
    proxy_cache nextendo;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  # Next.js Hashed asset bundles (`/_next/static/...`) — cache for 1 year.
  location /_next/static/ {
    proxy_pass http://nextendo_app;
    proxy_cache nextendo;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Health probe — used by Docker / k8s / uptime monitors. Pass through to
  # the Next.js Route Handler at /api/health.
  location = /api/health {
    proxy_pass http://nextendo_app;
    access_log off;
  }

  # Everything else under /api/* — proxied to the Go account backend. The
  # front-end sends Bearer tokens + HttpOnly cookies; nginx must forward
  # both. We do NOT add CORS headers here because the front-end is
  # served from the same origin.
  location /api/ {
    proxy_pass http://nextendo_account;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Auth pages and authenticated pages must never be served from a shared HTML
  # cache. Keep this location before the generic `/` location.
  location ~ ^/(login|register|forgot|reset|verify|compte|sessions)(/|$) {
    proxy_pass http://nextendo_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store" always;
  }

  # Default: everything else goes to the Next.js standalone bundle.
  # Includes the homepage, the auth flows (/login, /register, /forgot,
  # /reset, /verify), and the authenticated dashboard (/compte, /sessions).
  location / {
    proxy_pass http://nextendo_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Cache only public GET/HEAD responses. Cookies, Authorization and
    # Set-Cookie responses bypass the shared cache so authenticated state is
    # never served to another visitor.
    proxy_cache nextendo;
    proxy_cache_valid 10s;
    proxy_cache_methods GET HEAD;
    proxy_no_cache $http_cookie $http_authorization $upstream_http_set_cookie;
    proxy_cache_bypass $http_cookie $http_authorization;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status;
  }
}
