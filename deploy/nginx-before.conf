# nginx configuration BEFORE the cutover
# This was the live config on the VPS, serving the legacy vanilla-JS site.
# Captured 2026-08-03 from /etc/nginx/sites-enabled/nextendo.network.
# Kept as historical reference; DO NOT re-apply this config after the cutover.

upstream nextendo_app { server 127.0.0.1:3000; }
# upstream nextendo_account was the Go backend on a separate port.
# (Intentionally omitted here — it lives in a private repo the user doesn't
# want committed. The path /api/* in the legacy config proxied directly
# to the Go service.)

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name nextendo.network;

  ssl_certificate     /etc/letsencrypt/live/nextendo.network/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nextendo.network/privkey.pem;

  # Legacy static site (pre-cutover): the nginx server root held the
  # vanilla-JS files (Legacy/index.html, Legacy/login.html, account.html, …) plus
  # /assets/css/ and /assets/js/. These location blocks fall through to
  # /var/www/nextendo-legacy/. After the cutover they should be removed.
  root /var/www/nextendo-legacy;
  index index.html;

  # Direct file delivery for the legacy HTML pages.
  location = / { try_files $uri $uri/ /index.html; }
  location /assets/  { try_files $uri =404; }
  location ~ ^/(login|register|forgot|reset|verify|compte|sessions)\.html$ {
    try_files $uri =404;
  }

  # /api/* was proxied to the Go backend.
  location /api/ { proxy_pass http://nextendo_account; }

  # everything else served from the legacy static root.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
