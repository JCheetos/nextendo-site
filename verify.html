<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vérification de l'e-mail — Nextendo Network</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=5" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="field field--a"></div>
    <div class="field field--b"></div>
    <div class="grid-veil"></div>
  </div>

  <header class="nav" id="nav">
    <div class="shell nav__inner">
      <a class="brand" href="/" aria-label="Nextendo Network, accueil">
        <img class="brand__mark" src="assets/favicon.svg" alt="" width="30" height="30" />
        <span class="brand__word">Nextendo<span class="brand__dim"> Network</span></span>
      </a>
      <div class="nav__end">
        <a class="ghost-link" href="/">Accueil</a>
      </div>
    </div>
  </header>

  <main id="main"><div class="shell">
    <section class="auth" style="justify-content:center">
      <div class="auth__card" style="max-width:30rem;margin:0 auto;text-align:center">
        <div class="modal__ic" id="v-ic" style="font-size:2.9rem;color:var(--primary-bright);line-height:1"><i class="ph ph-circle-notch"></i></div>
        <h2 id="v-title" style="margin:0.7rem 0 0.5rem">Vérification…</h2>
        <p class="sub" id="v-msg" style="margin-bottom:1.3rem">On confirme ton adresse e-mail, un instant.</p>
        <div id="v-actions" hidden>
          <a class="btn btn--primary btn--block btn--lg" id="v-cta" href="/compte">Aller à mon compte <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
        </div>
      </div>
    </section>
  </div></main>

  <script src="assets/js/app.js?v=5"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const ic = document.getElementById('v-ic');
    const title = document.getElementById('v-title');
    const msg = document.getElementById('v-msg');
    const actions = document.getElementById('v-actions');
    const cta = document.getElementById('v-cta');

    function fail(text){
      ic.style.color = 'oklch(0.70 0.17 25)';
      ic.innerHTML = '<i class="ph ph-x-circle"></i>';
      title.textContent = 'Vérification impossible';
      msg.textContent = text;
      // pas connecté ? on propose la connexion plutôt que le compte
      if (!NX.token){ cta.setAttribute('href', '/login'); cta.innerHTML = 'Se connecter <i class="ph ph-arrow-right" aria-hidden="true"></i>'; }
      actions.hidden = false;
    }

    (async () => {
      if (!token){ fail("Lien invalide : aucun jeton de vérification. Renvoie l'e-mail depuis ton espace compte."); return; }
      try {
        const r = await NX.verifyEmail(token);
        ic.style.color = 'var(--signal)';
        ic.innerHTML = '<i class="ph ph-seal-check"></i>';
        title.textContent = 'E-mail confirmé !';
        msg.textContent = 'Ton adresse ' + (r.email || '') + ' est vérifiée. Ton compte est maintenant sécurisé.';
        if (!NX.token){ cta.setAttribute('href', '/login'); cta.innerHTML = 'Se connecter <i class="ph ph-arrow-right" aria-hidden="true"></i>'; }
        actions.hidden = false;
      } catch (err) {
        fail(err.message || 'Lien invalide ou expiré.');
      }
    })();
  </script>
</body>
</html>
